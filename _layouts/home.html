---
layout: home
hide_chrome: true
---
<div class="agora-bg"></div>

<div class="home">
  <h1 class="agora-title">Ágora Virtual</h1>
  {{ content }}
</div>

<style>
  body{/* Hide scrollbar for Chrome, Safari and Opera */
    &::-webkit-scrollbar {
        display: none;
    }
    
    scrollbar-width: none;-ms-overflow-style: none;overflow-y: auto;
  }
  
  .agora-bg {
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;

    background-image:
      linear-gradient(rgba(255,255,255,0.94), rgba(255,255,255,0.94)),
      repeating-linear-gradient(
        90deg,
        #b08d57 0px, #b08d57 4px,
        transparent 4px, transparent 8px
      ),
      repeating-linear-gradient(
        0deg,
        #b08d57 0px, #b08d57 4px,
        transparent 4px, transparent 8px
      );
    background-size: 100% 100%, 48px 48px, 48px 48px;
    opacity: 0.15;
    animation: agora-drift 40s linear infinite;
  }

  @keyframes agora-drift {
    from { background-position: 0 0, 0 0, 0 0; }
    to   { background-position: 0 0, 480px 0, 0 480px; }
  }

  .home {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    position: relative;
    z-index: 1;
  }

  .agora-title {
    font-family: Arial, Helvetica, sans-serif;
    margin: 0 0 1rem;
  }

  @media (prefers-reduced-motion: reduce) {
    .agora-bg { animation: none; }
  }
</style>
