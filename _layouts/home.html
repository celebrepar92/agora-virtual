---
layout: default
hide_chrome: true
---
<div class="agora-bg"></div>

<div class="home">
  <h1 class="agora-title">Ágora Virtual</h1>
  <p class="agora-greeting" id="agora-greeting"></p>

  {{ content }}
</div>

<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
  }

  .agora-bg {
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;

    background-image:
      linear-gradient(rgba(255,255,255,0.94), rgba(255,255,255,0.94)),
      repeating-linear-gradient(
        90deg,
        #b08d57 0px, #b08d57 4px,
        transparent 4px, transparent 8px
      ),
      repeating-linear-gradient(
        0deg,
        #b08d57 0px, #b08d57 4px,
        transparent 4px, transparent 8px
      );
    background-size: 100% 100%, 48px 48px, 48px 48px;
    opacity: 0.15;
    animation: agora-drift 40s linear infinite;
  }

  @keyframes agora-drift {
    from { background-position: 0 0, 0 0, 0 0; }
    to   { background-position: 0 0, 480px 0, 0 480px; }
  }

  .home {
    height: 100vh;
    width: 100vw;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    position: relative;
    z-index: 1;
    box-sizing: border-box;
    padding: 2rem;
  }

  .agora-title {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 2.8rem;
    margin: 0 0 0.5rem;
  }

  .agora-greeting {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 1.1rem;
    color: #666;
    margin: 0;
  }

  @media (prefers-reduced-motion: reduce) {
    .agora-bg { animation: none; }
  }
</style>

<script>
  const el = document.getElementById('agora-greeting');
  if (el) {
    const ahora = new Date();
    const mes = ahora.getMonth() + 1; // 1-12
    const dia = ahora.getDate();
    const hora = ahora.getHours();

    let mensaje;

    if (mes === 12 && dia === 25) {
      mensaje = "Feliz Navidad";
    } else if (mes === 1 && dia === 1) {
      mensaje = "Feliz Año Nuevo";
    } else if (hora >= 6 && hora < 12) {
      mensaje = "Buenos días";
    } else if (hora >= 12 && hora < 20) {
      mensaje = "Buenas tardes";
    } else {
      mensaje = "Buenas noches";
    }

    el.textContent = mensaje;
  }
</script>
