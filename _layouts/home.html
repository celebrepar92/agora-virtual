---
layout: default
---
<div class="home">
  <div class="agora-bg"></div>

  <h1 class="agora-title">Ágora Virtual</h1>

  {{ content }}
</div>

<style>
  .home {
    position: relative;
    overflow: hidden;
  }

  /* Fondo animado con greca griega */
  .agora-bg {
    position: absolute;
    inset: 0;
    z-index: -1;
    pointer-events: none;

    background-image:
      linear-gradient(rgba(255,255,255,0.94), rgba(255,255,255,0.94)),
      repeating-linear-gradient(
        90deg,
        #b08d57 0px, #b08d57 4px,
        transparent 4px, transparent 8px
      ),
      repeating-linear-gradient(
        0deg,
        #b08d57 0px, #b08d57 4px,
        transparent 4px, transparent 8px
      );
    background-size: 100% 100%, 48px 48px, 48px 48px;
    opacity: 0.15;
    animation: agora-drift 40s linear infinite;
  }

  @keyframes agora-drift {
    from { background-position: 0 0, 0 0, 0 0; }
    to   { background-position: 0 0, 480px 0, 0 480px; }
  }

  .agora-title {
    font-family: Arial, Helvetica, sans-serif;
    text-align: center;
    margin: 3rem auto 2rem;
    position: relative;
    z-index: 1;
  }

  /* Reduce el movimiento si el usuario lo prefiere */
  @media (prefers-reduced-motion: reduce) {
    .agora-bg {
      animation: none;
    }
  }
</style>
