<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tekohá</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <!-- Fuente Roboto e Iconos de Material Symbols -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0" rel="stylesheet" />

  <style>
    /* ==========================================================================
       MATERIAL DESIGN 3 (M3) TOKENS
       ========================================================================== */
    :root {
      --md-sys-color-primary: #006874;
      --md-sys-color-on-primary: #ffffff;
      --md-sys-color-primary-container: #97f0ff;
      --md-sys-color-on-primary-container: #001f25;
      --md-sys-color-secondary-container: #cce8ee;
      --md-sys-color-on-secondary-container: #051f23;
      --md-sys-color-surface: #f6fafb;
      --md-sys-color-on-surface: #191c1d;
      --md-sys-color-surface-variant: #dbe4e6;
      --md-sys-color-on-surface-variant: #3f484a;
      --md-sys-color-outline: #6f797b;
      --md-sys-color-outline-variant: #bfc8ca;

      --md-shape-corner-extra-small: 4px;
      --md-shape-corner-small: 8px;
      --md-shape-corner-medium: 12px;
      --md-shape-corner-large: 16px;
      --md-shape-corner-full: 9999px;

      --md-elevation-1: 0px 1px 3px 1px rgba(0, 0, 0, 0.12), 0px 1px 2px 0px rgba(0, 0, 0, 0.24);
      --md-elevation-2: 0px 2px 6px 2px rgba(0, 0, 0, 0.12);
      --md-elevation-3: 0px 4px 8px 3px rgba(0, 0, 0, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Roboto', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--md-sys-color-surface);
      color: var(--md-sys-color-on-surface);
      padding-bottom: 90px;
      min-height: 100vh;
    }

    /* Header */
    header {
      background-color: var(--md-sys-color-surface);
      padding: 12px 20px;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 1px 0 var(--md-sys-color-outline-variant);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    header h1 {
      font-size: 1.25rem;
      font-weight: 500;
      color: var(--md-sys-color-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-actions {
      display: flex;
      gap: 6px;
    }

    .btn-header {
      background-color: var(--md-sys-color-surface-variant);
      color: var(--md-sys-color-on-surface-variant);
      border: 1px solid var(--md-sys-color-outline-variant);
      padding: 6px 12px;
      border-radius: var(--md-shape-corner-full);
      font-size: 0.78rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .btn-header:hover {
      background-color: var(--md-sys-color-secondary-container);
      color: var(--md-sys-color-on-secondary-container);
    }

    /* Main Container */
    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 16px 12px;
    }

    /* Controls Bar (Filter Chips) */
    .controls-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }

    .controls {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }

    .controls::-webkit-scrollbar { display: none; }

    .chip {
      background-color: var(--md-sys-color-surface-variant);
      color: var(--md-sys-color-on-surface-variant);
      border: 1px solid var(--md-sys-color-outline-variant);
      padding: 4px 12px;
      border-radius: var(--md-shape-corner-small);
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .chip.active {
      background-color: var(--md-sys-color-secondary-container);
      color: var(--md-sys-color-on-secondary-container);
      border-color: transparent;
    }

    /* Contact List Grid */
    .contact-grid {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* TARJETA COMO ENLACE CONTENEDOR */
    .card-link-wrapper {
      text-decoration: none;
      color: inherit;
      display: block;
    }

    .card {
      background-color: var(--md-sys-color-surface);
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: var(--md-shape-corner-medium);
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .card:hover {
      box-shadow: var(--md-elevation-1);
      border-color: var(--md-sys-color-primary);
    }

    .card.visited-card {
      opacity: 0.65;
      background-color: #eef3f4;
    }

    .card-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1;
    }

    /* AVATAR E ICONO */
    .avatar-container {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      overflow: hidden;
      background-color: var(--md-sys-color-surface-variant);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .platform-icon {
      font-size: 22px;
      color: var(--md-sys-color-primary);
    }

    .info-group {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .name-row {
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--md-sys-color-on-surface);
    }

    .country-flag {
      font-size: 0.95rem;
      line-height: 1;
    }

    .city-tag {
      font-size: 0.75rem;
      color: var(--md-sys-color-outline);
    }

    .card-link-text {
      flex: 1;
      padding: 0 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--md-sys-color-primary);
      font-size: 0.85rem;
      font-weight: 500;
    }

    .card-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .visit-btn {
      display: flex;
      align-items: center;
      gap: 4px;
      background: none;
      border: 1px solid var(--md-sys-color-outline);
      padding: 4px 10px;
      border-radius: var(--md-shape-corner-full);
      font-size: 0.75rem;
      font-weight: 500;
      cursor: pointer;
      color: var(--md-sys-color-on-surface);
      white-space: nowrap;
    }

    .visit-btn.visited {
      background-color: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
      border-color: transparent;
    }

    .icon-btn {
      background: none;
      border: none;
      color: var(--md-sys-color-on-surface-variant);
      padding: 6px;
      border-radius: var(--md-shape-corner-full);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-btn:hover {
      background-color: var(--md-sys-color-surface-variant);
    }

    /* FAB */
    .fab {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background-color: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
      border: none;
      border-radius: var(--md-shape-corner-large);
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: var(--md-elevation-3);
      cursor: pointer;
      font-weight: 500;
      font-size: 0.9rem;
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background-color: rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .modal-backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background-color: var(--md-sys-color-surface);
      border-radius: var(--md-shape-corner-extra-large);
      padding: 20px;
      width: 100%;
      max-width: 440px;
      box-shadow: var(--md-elevation-3);
      margin: 16px;
    }

    .modal h2 {
      font-size: 1.25rem;
      font-weight: 500;
      margin-bottom: 16px;
    }

    .form-group {
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .form-group label {
      font-size: 0.8rem;
      color: var(--md-sys-color-on-surface-variant);
      font-weight: 500;
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--md-sys-color-outline);
      border-radius: var(--md-shape-corner-extra-small);
      font-size: 0.9rem;
      background: transparent;
      color: var(--md-sys-color-on-surface);
      outline: none;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 20px;
    }

    .btn {
      padding: 8px 18px;
      border-radius: var(--md-shape-corner-full);
      border: none;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
    }

    .btn-text { background: transparent; color: var(--md-sys-color-primary); }
    .btn-filled { background-color: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary); }

    .empty-state {
      text-align: center;
      padding: 40px 16px;
      color: var(--md-sys-color-outline);
    }
  </style>
</head>
<body>

  <header>
    <h1><span class="material-symbols-outlined">contacts</span> Tekohá</h1>
    <div class="header-actions">
      <button class="btn-header" id="exportBtn" title="Exportar JSON"><span class="material-symbols-outlined" style="font-size:16px;">download</span> Exportar</button>
      <button class="btn-header" id="importBtn" title="Importar JSON"><span class="material-symbols-outlined" style="font-size:16px;">upload</span> Importar</button>
      <input type="file" id="importInput" accept="application/json" style="display: none;" />
    </div>
  </header>

  <main>
    <div class="controls-container">
      <!-- Filtros por Plataforma -->
      <div class="controls" id="platformChips">
        <button class="chip active" data-platform="all">Todas las Plataformas</button>
        <button class="chip" data-platform="Instagram">Instagram</button>
        <button class="chip" data-platform="TikTok">TikTok</button>
        <button class="chip" data-platform="Facebook">Facebook</button>
        <button class="chip" data-platform="Web">Página Web</button>
      </div>

      <!-- Filtros por País (Dinamicos) -->
      <div class="controls" id="countryChips"></div>
    </div>

    <div class="contact-grid" id="contactGrid"></div>
  </main>

  <button class="fab" id="openModalBtn">
    <span class="material-symbols-outlined">add</span> Nuevo
  </button>

  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal">
      <h2 id="modalTitle">Agregar Contacto</h2>
      <form id="contactForm">
        <input type="hidden" id="contactId">
        
        <div class="form-group">
          <label for="nameInput">Nombre o Entidad *</label>
          <input type="text" id="nameInput" required placeholder="Ej. Galería Arte">
        </div>

        <div class="form-group">
          <label for="platformSelect">Plataforma *</label>
          <select id="platformSelect" required>
            <option value="Instagram">Instagram</option>
            <option value="TikTok">TikTok</option>
            <option value="Facebook">Facebook</option>
            <option value="Web">Página Web / URL Genérica</option>
          </select>
        </div>

        <div class="form-group">
          <label for="cityInput">Ciudad o País</label>
          <input type="text" id="cityInput" placeholder="Ej. Posadas, Misiones / Encarnación">
        </div>

        <div class="form-group">
          <label for="urlInput">Perfil o URL *</label>
          <input type="text" id="urlInput" required placeholder="Ej. https://www.instagram.com/carnavalencarnacion/">
        </div>

        <div class="form-group">
          <label for="imgUrlInput">URL de Imagen / Logo (opcional)</label>
          <input type="url" id="imgUrlInput" placeholder="Dejar vacío para favicon/icono automático">
        </div>

        <div class="modal-actions">
          <button type="button" class="btn btn-text" id="closeModalBtn">Cancelar</button>
          <button type="submit" class="btn btn-filled">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let contacts = JSON.parse(localStorage.getItem('tekoha_contacts')) || [];
    let activePlatformFilter = 'all';
    let activeCountryFilter = 'all';

    const contactGrid = document.getElementById('contactGrid');
    const modalBackdrop = document.getElementById('modalBackdrop');
    const contactForm = document.getElementById('contactForm');
    const openModalBtn = document.getElementById('openModalBtn');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const modalTitle = document.getElementById('modalTitle');
    const platformChips = document.getElementById('platformChips');
    const countryChips = document.getElementById('countryChips');
    const exportBtn = document.getElementById('exportBtn');
    const importBtn = document.getElementById('importBtn');
    const importInput = document.getElementById('importInput');

    document.addEventListener('DOMContentLoaded', () => {
      checkAndResetDailyVisits();
      renderContacts();
    });

    function checkAndResetDailyVisits() {
      const today = new Date().toDateString();
      const lastResetDate = localStorage.getItem('tekoha_last_reset');

      if (lastResetDate !== today) {
        contacts = contacts.map(c => ({ ...c, visited: false }));
        localStorage.setItem('tekoha_last_reset', today);
        saveContacts();
      }
    }

    function saveContacts() {
      localStorage.setItem('tekoha_contacts', JSON.stringify(contacts));
    }

    function getSortedContacts() {
      return [...contacts].sort((a, b) => a.name.localeCompare(b.name, 'es', { sensitivity: 'base' }));
    }

    function getPlatformIcon(platform) {
      switch(platform) {
        case 'Instagram': return 'photo_camera';
        case 'TikTok': return 'movie';
        case 'Facebook': return 'groups';
        default: return 'language';
      }
    }

    function getFullHref(url, platform) {
      if (url.startsWith('http://') || url.startsWith('https://')) return url;
      const cleanHandle = url.replace('@', '').trim();
      switch(platform) {
        case 'Instagram': return `https://instagram.com/${cleanHandle}`;
        case 'TikTok': return `https://tiktok.com/@${cleanHandle}`;
        case 'Facebook': return `https://facebook.com/${cleanHandle}`;
        default: return `https://${cleanHandle}`;
      }
    }

    function getFormattedDisplayLink(url, platform) {
      let clean = url.trim();
      
      if (platform === 'Instagram' || platform === 'TikTok' || platform === 'Facebook') {
        clean = clean.replace(/^https?:\/\/(www\.)?(instagram\.com|tiktok\.com\/@?|facebook\.com)\//i, '');
        clean = clean.split('/')[0].split('?')[0].replace('@', '').trim();
        return `@${clean}`;
      } 
      
      if (platform === 'Web') {
        clean = clean.replace(/^https?:\/\/(www\.)?/i, '');
        return clean.split('/')[0].split('?')[0];
      }

      return clean;
    }

    function getAutoFaviconUrl(url) {
      try {
        const fullHref = url.startsWith('http') ? url : `https://${url}`;
        const domain = new URL(fullHref).hostname;
        return `https://www.google.com/s2/favicons?domain=${domain}&sz=64`;
      } catch (e) {
        return null;
      }
    }

    function getCountryFlag(locationText) {
      if (!locationText) return '';
      const text = locationText.toLowerCase();

      const countries = [
        { keys: ['argentina', 'posadas', 'buenos aires', 'córdoba', 'rosario', 'misiones', 'corrientes'], flag: '🇦🇷', code: 'AR', name: 'Argentina' },
        { keys: ['paraguay', 'encarnación', 'asunción', 'ciudad del este'], flag: '🇵🇾', code: 'PY', name: 'Paraguay' },
        { keys: ['brasil', 'brazil', 'sao paulo', 'rio', 'foz', 'curitiba'], flag: '🇧🇷', code: 'BR', name: 'Brasil' },
        { keys: ['uruguay', 'montevideo', 'punta del este'], flag: '🇺🇾', code: 'UY', name: 'Uruguay' },
        { keys: ['chile', 'santiago'], flag: '🇨🇱', code: 'CL', name: 'Chile' },
        { keys: ['méxico', 'mexico', 'cdmx'], flag: '🇲🇽', code: 'MX', name: 'México' },
        { keys: ['españa', 'spain', 'madrid', 'barcelona'], flag: '🇪🇸', code: 'ES', name: 'España' },
        { keys: ['colombia', 'bogotá', 'medellín'], flag: '🇨🇴', code: 'CO', name: 'Colombia' },
        { keys: ['perú', 'peru', 'lima'], flag: '🇵🇪', code: 'PE', name: 'Perú' },
        { keys: ['usa', 'eeuu', 'estados unidos', 'miami', 'new york'], flag: '🇺🇸', code: 'US', name: 'EE.UU.' }
      ];

      for (const c of countries) {
        if (c.keys.some(k => text.includes(k))) return c;
      }

      return null;
    }

    // GENERAR DINÁMICAMENTE CHIPS DE PAÍSES BASADOS EN CONTACTOS
    function renderCountryChips() {
      const countryMap = new Map();

      contacts.forEach(c => {
        const countryInfo = getCountryFlag(c.city);
        if (countryInfo) {
          countryMap.set(countryInfo.code, countryInfo);
        }
      });

      if (countryMap.size === 0) {
        countryChips.style.display = 'none';
        return;
      }

      countryChips.style.display = 'flex';
      countryChips.innerHTML = `<button class="chip ${activeCountryFilter === 'all' ? 'active' : ''}" data-country="all">Todos los Países</button>`;

      countryMap.forEach(country => {
        const btn = document.createElement('button');
        btn.className = `chip ${activeCountryFilter === country.code ? 'active' : ''}`;
        btn.dataset.country = country.code;
        btn.innerHTML = `${country.flag} ${country.name}`;
        countryChips.appendChild(btn);
      });
    }

    function renderContacts() {
      renderCountryChips();
      contactGrid.innerHTML = '';
      
      const filtered = getSortedContacts().filter(c => {
        const matchesPlatform = activePlatformFilter === 'all' || c.platform === activePlatformFilter;
        
        const countryInfo = getCountryFlag(c.city);
        const matchesCountry = activeCountryFilter === 'all' || (countryInfo && countryInfo.code === activeCountryFilter);

        return matchesPlatform && matchesCountry;
      });

      if (filtered.length === 0) {
        contactGrid.innerHTML = `
          <div class="empty-state">
            <span class="material-symbols-outlined" style="font-size:36px;">search_off</span>
            <p style="font-size:0.9rem; margin-top:4px;">No se encontraron perfiles con los filtros seleccionados.</p>
          </div>
        `;
        return;
      }

      filtered.forEach(contact => {
        const countryInfo = getCountryFlag(contact.city);
        const flag = countryInfo ? countryInfo.flag : '';

        let displayImgUrl = contact.imgUrl;
        if (!displayImgUrl && contact.platform === 'Web') {
          displayImgUrl = getAutoFaviconUrl(contact.url);
        }

        const avatarHtml = displayImgUrl 
          ? `<div class="avatar-container"><img src="${escapeHtml(displayImgUrl)}" class="avatar-img" alt="${escapeHtml(contact.name)}" onerror="this.onerror=null; this.parentElement.innerHTML='<span class=\\'material-symbols-outlined platform-icon\\'>${getPlatformIcon(contact.platform)}</span>';"></div>`
          : `<div class="avatar-container"><span class="material-symbols-outlined platform-icon">${getPlatformIcon(contact.platform)}</span></div>`;

        const cardWrapper = document.createElement('a');
        cardWrapper.className = 'card-link-wrapper';
        cardWrapper.href = getFullHref(contact.url, contact.platform);
        cardWrapper.target = '_blank';
        cardWrapper.rel = 'noopener noreferrer';
        cardWrapper.onclick = () => handleAutoVisit(contact.id);

        cardWrapper.innerHTML = `
          <div class="card ${contact.visited ? 'visited-card' : ''}">
            <div class="card-left">
              ${avatarHtml}
              <div class="info-group">
                <div class="name-row">
                  <span class="card-title">${escapeHtml(contact.name)}</span>
                  ${flag ? `<span class="country-flag">${flag}</span>` : ''}
                </div>
                ${contact.city ? `<span class="city-tag">${escapeHtml(contact.city)}</span>` : ''}
              </div>
            </div>

            <div class="card-link-text">
              ${escapeHtml(getFormattedDisplayLink(contact.url, contact.platform))}
            </div>

            <div class="card-right">
              <button class="visit-btn ${contact.visited ? 'visited' : ''}" onclick="event.preventDefault(); event.stopPropagation(); toggleVisit('${contact.id}')">
                <span class="material-symbols-outlined" style="font-size: 14px;">
                  ${contact.visited ? 'check_circle' : 'radio_button_unchecked'}
                </span>
                ${contact.visited ? 'Visitado' : 'Marcar'}
              </button>
              <button class="icon-btn" onclick="event.preventDefault(); event.stopPropagation(); openEditModal('${contact.id}')" title="Editar">
                <span class="material-symbols-outlined" style="font-size: 18px;">edit</span>
              </button>
              <button class="icon-btn" onclick="event.preventDefault(); event.stopPropagation(); deleteContact('${contact.id}')" title="Eliminar">
                <span class="material-symbols-outlined" style="font-size: 18px;">delete</span>
              </button>
            </div>
          </div>
        `;
        contactGrid.appendChild(cardWrapper);
      });
    }

    window.handleAutoVisit = function(id) {
      contacts = contacts.map(c => c.id === id ? { ...c, visited: true } : c);
      saveContacts();
      setTimeout(renderContacts, 300);
    };

    window.toggleVisit = function(id) {
      contacts = contacts.map(c => c.id === id ? { ...c, visited: !c.visited } : c);
      saveContacts();
      renderContacts();
    };

    // Event listeners para filtros
    platformChips.addEventListener('click', (e) => {
      if (e.target.classList.contains('chip')) {
        platformChips.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
        e.target.classList.add('active');
        activePlatformFilter = e.target.dataset.platform;
        renderContacts();
      }
    });

    countryChips.addEventListener('click', (e) => {
      if (e.target.classList.contains('chip')) {
        countryChips.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
        e.target.classList.add('active');
        activeCountryFilter = e.target.dataset.country;
        renderContacts();
      }
    });

    function openModal() { modalBackdrop.classList.add('active'); }
    function closeModal() { 
      modalBackdrop.classList.remove('active'); 
      contactForm.reset();
      document.getElementById('contactId').value = '';
      modalTitle.textContent = 'Agregar Contacto';
    }

    openModalBtn.addEventListener('click', openModal);
    closeModalBtn.addEventListener('click', closeModal);

    window.openEditModal = function(id) {
      const contact = contacts.find(c => c.id === id);
      if (!contact) return;

      document.getElementById('contactId').value = contact.id;
      document.getElementById('nameInput').value = contact.name;
      document.getElementById('platformSelect').value = contact.platform;
      document.getElementById('cityInput').value = contact.city || '';
      document.getElementById('urlInput').value = contact.url;
      document.getElementById('imgUrlInput').value = contact.imgUrl || '';

      modalTitle.textContent = 'Editar Contacto';
      openModal();
    };

    window.deleteContact = function(id) {
      if (confirm('¿Eliminar este perfil de Tekohá?')) {
        contacts = contacts.filter(c => c.id !== id);
        saveContacts();
        renderContacts();
      }
    };

    contactForm.addEventListener('submit', (e) => {
      e.preventDefault();

      const id = document.getElementById('contactId').value;
      const name = document.getElementById('nameInput').value.trim();
      const platform = document.getElementById('platformSelect').value;
      const city = document.getElementById('cityInput').value.trim();
      const url = document.getElementById('urlInput').value.trim();
      const imgUrl = document.getElementById('imgUrlInput').value.trim();

      if (id) {
        contacts = contacts.map(c => c.id === id ? { ...c, name, platform, city, url, imgUrl } : c);
      } else {
        contacts.push({
          id: Date.now().toString(),
          name,
          platform,
          city,
          url,
          imgUrl,
          visited: false
        });
      }

      saveContacts();
      renderContacts();
      closeModal();
    });

    exportBtn.addEventListener('click', () => {
      if (contacts.length === 0) return alert('No hay contactos.');
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(contacts, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `tekoha_agenda_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    });

    importBtn.addEventListener('click', () => importInput.click());

    importInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        try {
          const imported = JSON.parse(event.target.result);
          if (Array.isArray(imported)) {
            if (confirm('¿Deseas reemplazar tu agenda actual con los contactos importados?')) {
              contacts = imported;
            } else {
              imported.forEach(item => {
                item.id = Date.now().toString() + Math.random().toString(36).substr(2, 5);
                contacts.push(item);
              });
            }
            saveContacts();
            renderContacts();
          }
        } catch (err) { alert('Error al leer el JSON'); }
      };
      reader.readAsText(file);
      importInput.value = '';
    });

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }
  </script>
</body>
</html>
