<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BigTree Search</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    /* Estilos globales y reset liviano */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #ffffff;
      color: #333;
    }

    /* Contenedor principal del buscador */
    .search-container {
      display: flex;
      align-items: center;
      gap: 16px;
      width: 90%;
      max-width: 780px;
    }

    /* Logo */
    .brand-logo {
      width: 200px;
      height: auto;
      object-fit: contain;
    }

    /* Formulario de búsqueda */
    .search-form {
      display: flex;
      flex: 1;
      border: 1px solid #dfe1e5;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 1px 6px rgba(32, 33, 36, 0.08);
      transition: box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .search-form:hover,
    .search-form:focus-within {
      box-shadow: 0 1px 12px rgba(32, 33, 36, 0.16);
      border-color: rgba(223, 225, 229, 0);
    }

    .search-input {
      flex: 1;
      border: none;
      padding: 12px 20px;
      font-size: 16px;
      outline: none;
      background: transparent;
    }

    .search-button {
      background-color: #2e7d32; /* Verde natural para BigTree */
      color: #ffffff;
      border: none;
      padding: 0 24px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .search-button:hover {
      background-color: #1b5e20;
    }

    /* Adaptabilidad para pantallas pequeñas */
    @media (max-width: 500px) {
      .search-container {
        flex-direction: column;
        gap: 20px;
      }
      
      .search-form {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <main class="search-container">
    <!-- Logo al lado del buscador -->
    <a href="#" title="BigTree Home">
      <img src="logo.png" alt="BigTree Logo" class="brand-logo">
    </a>

    <!-- Formulario que envía la consulta directamente a Google -->
    <form action="https://www.google.com/search" method="GET" class="search-form">
      <input 
        type="text" 
        name="q" 
        class="search-input" 
        placeholder="Buscar en BigTree..." 
        required 
        autofocus
        autocomplete="off"
      />
      <button type="submit" class="search-button">Buscar</button>
    </form>
  </main>

</body>
</html>
