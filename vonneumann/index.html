<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VonNeumann - Convertidor de imágenes</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0,0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>

  <style>
    :root {
      --bg: #09090b;
      --surface: #121215;
      --surface-border: #27272a;
      --text: #f4f4f5;
      --text-muted: #71717a;
      --accent: #ffffff;
      --accent-bg: #27272a;
      --danger: #ef4444;
      --success: #22c55e;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    [data-theme="light"] {
      --bg: #fafafa;
      --surface: #ffffff;
      --surface-border: #e4e4e7;
      --text: #09090b;
      --text-muted: #a1a1aa;
      --accent: #09090b;
      --accent-bg: #f4f4f5;
      --danger: #dc2626;
      --success: #16a34a;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: background-color 0.2s, color 0.2s;
      -webkit-font-smoothing: antialiased;
    }

    header {
      width: 100%;
      max-width: 680px;
      padding: 32px 24px 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand { font-size: 18px; font-weight: 600; letter-spacing: -0.02em; }

    .theme-btn {
      background: none; border: none; color: var(--text-muted); cursor: pointer;
      display: flex; align-items: center; padding: 6px; border-radius: 6px; transition: color 0.15s;
    }
    .theme-btn:hover { color: var(--text); }

    main {
      width: 100%; max-width: 680px; padding: 0 24px 64px 24px;
      display: flex; flex-direction: column; gap: 20px;
    }

    .drop-zone {
      background: var(--surface); border: 1px dashed var(--surface-border); border-radius: 12px;
      padding: 40px 20px; text-align: center; cursor: pointer; transition: border-color 0.15s, background-color 0.15s;
    }
    .drop-zone:hover, .drop-zone.drag-over { border-color: var(--text-muted); background: var(--accent-bg); }
    .drop-icon { font-size: 28px; color: var(--text-muted); margin-bottom: 8px; }
    .drop-title { font-size: 14px; font-weight: 500; margin-bottom: 4px; }
    .drop-sub { font-size: 12px; color: var(--text-muted); }
    #fileInput { display: none; }

    .controls-bar {
      display: flex; gap: 12px; align-items: center; background: var(--surface);
      border: 1px solid var(--surface-border); border-radius: 10px; padding: 12px 16px; flex-wrap: wrap;
    }

    .control-item { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-muted); }

    select {
      background: var(--bg); color: var(--text); border: 1px solid var(--surface-border);
      border-radius: 6px; padding: 6px 10px; font-size: 13px; font-family: inherit; outline: none; cursor: pointer;
    }

    .slider-group { display: flex; align-items: center; gap: 8px; margin-left: auto; }
    input[type="range"] { width: 80px; accent-color: var(--text); }
    .quality-num { font-family: var(--font-mono); font-size: 12px; width: 32px; }

    .btn-group { display: flex; gap: 8px; margin-top: 4px; }
    .btn {
      flex: 1; height: 38px; border-radius: 8px; font-family: inherit; font-size: 13px; font-weight: 500;
      border: 1px solid var(--surface-border); background: var(--surface); color: var(--text);
      cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: opacity 0.15s;
    }
    .btn-primary { background: var(--accent); color: var(--bg); border: none; }
    .btn:hover:not(:disabled) { opacity: 0.85; }
    .btn:disabled { opacity: 0.3; cursor: not-allowed; }

    .file-list { display: flex; flex-direction: column; gap: 8px; }
    .file-item {
      display: flex; align-items: center; gap: 12px; background: var(--surface);
      border: 1px solid var(--surface-border); border-radius: 8px; padding: 10px 12px;
    }

    .thumb {
      width: 40px; height: 40px; border-radius: 6px; object-fit: cover; background: var(--bg);
      flex-shrink: 0; cursor: pointer; display: flex; align-items: center; justify-content: center;
      color: var(--text-muted); overflow: hidden;
    }
    .thumb img { width: 100%; height: 100%; object-fit: cover; }

    .meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .details { font-size: 11px; font-family: var(--font-mono); color: var(--text-muted); display: flex; gap: 8px; }

    .status-badge { text-transform: capitalize; }
    .status-done { color: var(--success); }
    .status-error { color: var(--danger); }

    .actions { display: flex; gap: 4px; }
    .icon-btn {
      background: none; border: none; color: var(--text-muted); width: 32px; height: 32px;
      border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .icon-btn:hover { color: var(--text); background: var(--accent-bg); }

    .modal {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 100;
    }
    .modal.active { opacity: 1; pointer-events: auto; }
    .modal img { max-width: 90vw; max-height: 85vh; border-radius: 8px; object-fit: contain; }

    .spinner {
      width: 14px; height: 14px; border: 2px solid var(--surface-border);
      border-top-color: var(--text); border-radius: 50%; animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body data-theme="dark">

  <header>
    <div class="brand">VonNeumann</div>
    <button class="theme-btn" id="themeBtn" title="Tema">
      <span class="material-symbols-outlined" style="font-size: 20px;">light_mode</span>
    </button>
  </header>

  <main>
    <div class="drop-zone" id="dropZone">
      <input type="file" id="fileInput" multiple accept="image/*,.heic,.heif,.svg,.bmp,.tiff,.webp,.avif">
      <span class="material-symbols-outlined drop-icon">add_photo_alternate</span>
      <div class="drop-title">Arrastra o selecciona tus imágenes</div>
      <div class="drop-sub">PNG, JPG, WEBP, AVIF, HEIC, BMP, SVG</div>
    </div>

    <div class="controls-bar">
      <div class="control-item">
        <span>Formato:</span>
        <select id="targetFormat">
          <option value="image/png" selected>PNG</option>
          <option value="image/jpeg">JPG</option>
          <option value="image/webp">WEBP</option>
          <option value="image/avif">AVIF</option>
          <option value="image/bmp">BMP</option>
          <option value="image/x-icon">ICO</option>
        </select>
      </div>

      <div class="slider-group" id="qualityGroup">
        <span style="font-size:13px; color:var(--text-muted);">Calidad:</span>
        <input type="range" id="qualityRange" min="1" max="100" value="90">
        <span class="quality-num" id="qualityVal">90%</span>
      </div>
    </div>

    <div class="btn-group">
      <button class="btn btn-primary" id="convertBtn" disabled>
        <span class="material-symbols-outlined" style="font-size: 18px;">bolt</span>
        Convertir
      </button>
      <button class="btn" id="zipBtn" disabled>
        <span class="material-symbols-outlined" style="font-size: 18px;">download</span>
        ZIP
      </button>
      <button class="btn" id="clearBtn" disabled>Limpiar</button>
    </div>

    <div class="file-list" id="fileList"></div>
  </main>

  <div class="modal" id="modal">
    <img id="modalImg" src="" alt="Preview">
  </div>

  <script>
    const state = { files: [], format: 'image/png', quality: 0.90, theme: 'dark' };
    const extMap = { 'image/jpeg': '.jpg', 'image/png': '.png', 'image/webp': '.webp', 'image/avif': '.avif', 'image/bmp': '.bmp', 'image/x-icon': '.ico' };

    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const targetFormat = document.getElementById('targetFormat');
    const qualityRange = document.getElementById('qualityRange');
    const qualityVal = document.getElementById('qualityVal');
    const convertBtn = document.getElementById('convertBtn');
    const zipBtn = document.getElementById('zipBtn');
    const clearBtn = document.getElementById('clearBtn');
    const fileList = document.getElementById('fileList');
    const themeBtn = document.getElementById('themeBtn');
    const modal = document.getElementById('modal');
    const modalImg = document.getElementById('modalImg');

    document.addEventListener('DOMContentLoaded', () => {
      themeBtn.addEventListener('click', () => {
        state.theme = state.theme === 'dark' ? 'light' : 'dark';
        document.body.setAttribute('data-theme', state.theme);
        themeBtn.querySelector('span').textContent = state.theme === 'dark' ? 'light_mode' : 'dark_mode';
      });

      dropZone.addEventListener('click', () => fileInput.click());
      dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('drag-over'); });
      ['dragleave', 'dragend'].forEach(e => dropZone.addEventListener(e, () => dropZone.classList.remove('drag-over')));
      dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('drag-over');
        if (e.dataTransfer.files) handleFiles(Array.from(e.dataTransfer.files));
      });

      fileInput.addEventListener('change', (e) => {
        if (e.target.files) handleFiles(Array.from(e.target.files));
        fileInput.value = '';
      });

      targetFormat.addEventListener('change', (e) => state.format = e.target.value);
      qualityRange.addEventListener('input', (e) => {
        qualityVal.textContent = e.target.value + '%';
        state.quality = parseFloat(e.target.value) / 100;
      });

      convertBtn.addEventListener('click', convertAll);
      clearBtn.addEventListener('click', () => { state.files = []; updateUI(); });
      zipBtn.addEventListener('click', downloadZip);

      modal.addEventListener('click', () => modal.classList.remove('active'));
      document.addEventListener('keydown', (e) => { if (e.key === 'Escape') modal.classList.remove('active'); });
    });

    function handleFiles(files) {
      files.forEach(file => {
        const item = {
          id: 'f_' + Math.random().toString(36).substring(2, 9),
          file, name: file.name, size: file.size,
          status: 'ready', previewUrl: file.type.startsWith('image/') && !file.name.toLowerCase().endsWith('.heic') ? URL.createObjectURL(file) : null
        };
        state.files.push(item);
      });
      updateUI();
    }

    function updateUI() {
      convertBtn.disabled = state.files.length === 0 || state.files.every(f => f.status === 'done');
      clearBtn.disabled = state.files.length === 0;
      zipBtn.disabled = !state.files.some(f => f.status === 'done' && f.convertedBlob);
      renderList();
    }

    function renderList() {
      fileList.innerHTML = '';
      state.files.forEach(f => {
        const currentSrc = f.convertedUrl || f.previewUrl;
        const el = document.createElement('div');
        el.className = 'file-item';
        el.innerHTML = `
          <div class="thumb" onclick="${currentSrc ? `openModal('${currentSrc}')` : ''}">
            ${currentSrc ? `<img src="${currentSrc}">` : '<span class="material-symbols-outlined" style="font-size:18px;">image</span>'}
          </div>
          <div class="meta">
            <div class="name">${f.name}</div>
            <div class="details">
              <span>${formatBytes(f.size)} ${f.convertedSize ? '➔ ' + formatBytes(f.convertedSize) : ''}</span>
              <span class="status-badge status-${f.status}">${f.status === 'converting' ? '<div class="spinner"></div>' : f.status}</span>
            </div>
          </div>
          <div class="actions">
            ${currentSrc ? `<button class="icon-btn" onclick="openModal('${currentSrc}')" title="Ver"><span class="material-symbols-outlined" style="font-size:18px;">visibility</span></button>` : ''}
            ${f.convertedUrl ? `<a class="icon-btn" href="${f.convertedUrl}" download="${getDownloadName(f.name)}" title="Descargar"><span class="material-symbols-outlined" style="font-size:18px;">download</span></a>` : ''}
            <button class="icon-btn" onclick="removeFile('${f.id}')" title="Eliminar"><span class="material-symbols-outlined" style="font-size:18px;">close</span></button>
          </div>
        `;
        fileList.appendChild(el);
      });
    }

    async function convertSingle(f) {
      f.status = 'converting'; updateUI();
      try {
        let src = f.file;
        if ((f.name.toLowerCase().endsWith('.heic') || f.name.toLowerCase().endsWith('.heif')) && typeof heic2any !== 'undefined') {
          const res = await heic2any({ blob: f.file, toType: 'image/png' });
          src = Array.isArray(res) ? res[0] : res;
        }

        const img = new Image();
        const objUrl = URL.createObjectURL(src);
        img.src = objUrl;
        await img.decode();

        const canvas = document.createElement('canvas');
        canvas.width = img.width; canvas.height = img.height;
        const ctx = canvas.getContext('2d');

        if (['image/jpeg', 'image/bmp'].includes(state.format)) {
          ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
        ctx.drawImage(img, 0, 0);
        URL.revokeObjectURL(objUrl);

        f.convertedBlob = await new Promise(r => canvas.toBlob(r, state.format, state.quality));
        f.convertedUrl = URL.createObjectURL(f.convertedBlob);
        f.convertedSize = f.convertedBlob.size;
        f.status = 'done';
      } catch (e) {
        console.error(e);
        f.status = 'error';
      }
      updateUI();
    }

    async function convertAll() {
      for (const f of state.files.filter(x => x.status !== 'done')) {
        await convertSingle(f);
      }
    }

    async function downloadZip() {
      const zip = new JSZip();
      state.files.filter(f => f.status === 'done').forEach(f => {
        zip.file(getDownloadName(f.name), f.convertedBlob);
      });
      const blob = await zip.generateAsync({ type: 'blob' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'VonNeumann_images.zip';
      a.click();
    }

    function removeFile(id) {
      state.files = state.files.filter(f => f.id !== id);
      updateUI();
    }

    function openModal(src) {
      modalImg.src = src;
      modal.classList.add('active');
    }

    function getDownloadName(name) {
      const base = name.substring(0, name.lastIndexOf('.')) || name;
      return `${base}_converted${extMap[state.format] || '.img'}`;
    }

    function formatBytes(b) {
      if (!b) return '0 B';
      const k = 1024, sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(b) / Math.log(k));
      return parseFloat((b / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
    }
  </script>
</body>
</html>
